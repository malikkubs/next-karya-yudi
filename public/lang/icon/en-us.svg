<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="60"/>
    </clipPath>
  </defs>

  <!-- Border -->
  <circle cx="64" cy="64" r="60" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>

  <!-- Flag -->
  <g clip-path="url(#circleClip)">
    
    <!-- White background -->
    <rect width="128" height="128" fill="#FFFFFF"/>

    <!-- Red stripes -->
    <rect y="0" width="128" height="10" fill="#B22234"/>
    <rect y="20" width="128" height="10" fill="#B22234"/>
    <rect y="40" width="128" height="10" fill="#B22234"/>
    <rect y="60" width="128" height="10" fill="#B22234"/>
    <rect y="80" width="128" height="10" fill="#B22234"/>
    <rect y="100" width="128" height="10" fill="#B22234"/>
    <rect y="120" width="128" height="10" fill="#B22234"/>

    <!-- Blue canton -->
    <rect x="0" y="0" width="58" height="70" fill="#3C3B6E"/>

    <!-- Stars -->
    <g fill="#FFFFFF">
      <circle cx="8" cy="8" r="2"/>
      <circle cx="20" cy="8" r="2"/>
      <circle cx="32" cy="8" r="2"/>
      <circle cx="44" cy="8" r="2"/>

      <circle cx="14" cy="18" r="2"/>
      <circle cx="26" cy="18" r="2"/>
      <circle cx="38" cy="18" r="2"/>
      <circle cx="50" cy="18" r="2"/>

      <circle cx="8" cy="28" r="2"/>
      <circle cx="20" cy="28" r="2"/>
      <circle cx="32" cy="28" r="2"/>
      <circle cx="44" cy="28" r="2"/>

      <circle cx="14" cy="38" r="2"/>
      <circle cx="26" cy="38" r="2"/>
      <circle cx="38" cy="38" r="2"/>
      <circle cx="50" cy="38" r="2"/>

      <circle cx="8" cy="48" r="2"/>
      <circle cx="20" cy="48" r="2"/>
      <circle cx="32" cy="48" r="2"/>
      <circle cx="44" cy="48" r="2"/>

      <circle cx="14" cy="58" r="2"/>
      <circle cx="26" cy="58" r="2"/>
      <circle cx="38" cy="58" r="2"/>
      <circle cx="50" cy="58" r="2"/>
    </g>

  </g>
</svg>
